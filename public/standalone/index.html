<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SkyFly Arcade Multiplier Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <canvas id="flightCanvas"></canvas>

    <!-- Home UI -->
    <div id="homeUI" class="hud-layer">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="font-aviation" style="color:#38bdf8; font-weight:bold; letter-spacing:1px;">SKYFLY ARCADE</span>
        <span style="font-size:12px; color:#94a3b8;">v1.0</span>
      </div>

      <div style="text-align:center; margin:auto;">
        <h1 class="font-aviation" style="font-size:3rem; font-weight:900; letter-spacing:2px; margin-bottom:16px;">SKYFLY</h1>
        <div style="display:flex; gap:12px; justify-content:center; margin-bottom:24px;">
          <div style="background:#0b1329; padding:10px 16px; border-radius:12px; border:1px solid #1e293b;">
            <div style="font-size:10px; color:#94a3b8;">BEST SCORE</div>
            <div id="hiScore" class="font-aviation" style="font-size:1.4rem; color:#facc15; font-weight:bold;">0</div>
          </div>
        </div>
        <button id="btnStart" class="btn-primary font-aviation interactive">START FLIGHT</button>
      </div>

      <div style="text-align:center; font-size:11px; color:#64748b;">
        Pure Score-Based Arcade • No Real Money • Multipliers 1.00x - 50.00x
      </div>
    </div>

    <!-- Active Flight HUD -->
    <div id="gameUI" class="hud-layer" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="font-aviation" style="color:#34d399; font-size:12px; font-weight:bold;">● IN FLIGHT</span>
        <span style="font-size:12px; color:#cbd5e1;">SCORE: <strong id="curScore">0</strong></span>
      </div>

      <div style="text-align:center; margin:auto;">
        <div id="multiplier" class="multiplier-text font-aviation">1.00x</div>
      </div>

      <div style="width:100%;">
        <button id="btnClaim" class="btn-claim font-aviation interactive">
          <span id="scorePreview">CLAIM SCORE</span>
        </button>
      </div>
    </div>

    <!-- Result / Crashed Modal -->
    <div id="crashedUI" class="hud-layer" style="display:none; background:rgba(3, 7, 18, 0.85); justify-content:center; align-items:center;">
      <div style="background:#0f172a; padding:24px; border-radius:24px; border:1px solid #334155; text-align:center; width:90%; max-width:320px;" class="interactive">
        <h2 id="modalTitle" class="font-aviation" style="font-size:1.5rem; font-weight:900; margin-bottom:6px;">FLIGHT SUMMARY</h2>
        <div id="modalMultiplier" style="font-size:13px; color:#94a3b8; margin-bottom:12px;"></div>
        <div id="modalScore" class="font-aviation" style="font-size:2.2rem; font-weight:900; color:#38bdf8; margin-bottom:20px;">+0 PTS</div>
        <button id="btnRestart" class="btn-primary font-aviation">NEW FLIGHT</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
